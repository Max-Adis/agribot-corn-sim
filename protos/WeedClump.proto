#VRML_SIM R2025a utf8
# Adventice basse, visuelle seulement, pour ne pas bloquer l'allée ni la physique.

PROTO WeedClump [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "weed"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Pose {
        translation 0 0 0.07
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.55 0.72 0.16
              roughness 0.8
            }
            geometry Cone {
              bottomRadius 0.055
              height 0.14
              subdivision 6
            }
          }
        ]
      }
      Pose {
        translation 0.06 0.03 0.045
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.40 0.62 0.13
              roughness 0.85
            }
            geometry Sphere {
              radius 0.04
              subdivision 2
            }
          }
        ]
      }
      Pose {
        translation -0.045 0.02 0.04
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.48 0.66 0.14
              roughness 0.85
            }
            geometry Sphere {
              radius 0.032
              subdivision 2
            }
          }
        ]
      }
    ]
  }
}
