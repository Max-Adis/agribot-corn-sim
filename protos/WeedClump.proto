#VRML_SIM R2023b utf8
# Adventice basse, environ 8 cm, visuelle seulement.

PROTO WeedClump [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "weed"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Transform {
        translation 0 0 0.04
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.42 0.65 0.12 roughness 0.8 }
            geometry Sphere { radius 0.09 }
          }
        ]
      }
    ]
  }
}
