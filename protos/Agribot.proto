#VRML_SIM R2025a utf8
# Agribot v9b (CAO FreeCAD AGRIBOT_v9b, 4 nov. 2026). Hors tout 895 x 500 x 500 mm.
# Châssis 2020 + plateau 882x440, roues Ø165 x 20 à l'extérieur (voie 480, empattement 600),
# cabine électronique fermée à l'avant + capot (hayon) fermé, bac 570x440x240 à plat,
# bras L1 150 / L2 250 / L3 150 + bec 60, épaule X170 Z200, pince tournée de 90° (fixe)
# autour de L3 : doigts vers le sol en pose sol, fermeture latérale.
# Maillages : tools/export_arm_links.py (STL de livraison v9b, mm, échelle 0.001).
# Position 0 de tous les servos = pose repos CAO (lacet 180, épaule 115, coude -90, poignet -120),
# avec les mêmes axes que la v7 : S1 +Z, S2 +Y, S3 +Y, S4 -Y.
# Pose sol CAO (270 / 26.83 / -36.9 / -79.93) = S1 1.5708, S2 -1.5389, S3 0.9268, S4 -0.6994.
# Masse totale ≈ 16.1 kg (dont achats estimés, voir tools/v9b_mass_report.json).

PROTO Agribot [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "agribot"
  field SFString   controller  "agribot_controller"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    supervisor TRUE
    selfCollision TRUE
    children [
      # Corps fixe (pose repos) : alu, cabine blanche, PETG, bac, électronique / moteurs.
      Transform {
        scale 0.001 0.001 0.001
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.75 0.77 0.80
              roughness 0.35
              metalness 0.6
            }
            geometry Mesh {
              url [ "../meshes/body_alu.stl" ]
            }
          }
          Shape {
            appearance PBRAppearance {
              baseColor 0.96 0.96 0.95
              roughness 0.5
              metalness 0.0
            }
            geometry Mesh {
              url [ "../meshes/body_white.stl" ]
            }
          }
          Shape {
            appearance PBRAppearance {
              baseColor 0.45 0.80 0.45
              roughness 0.6
              metalness 0.0
            }
            geometry Mesh {
              url [ "../meshes/body_print.stl" ]
            }
          }
          Shape {
            appearance PBRAppearance {
              baseColor 0.40 0.62 0.92
              roughness 0.6
              metalness 0.0
            }
            geometry Mesh {
              url [ "../meshes/body_bin.stl" ]
            }
          }
          Shape {
            appearance PBRAppearance {
              baseColor 0.22 0.22 0.25
              roughness 0.5
              metalness 0.2
            }
            geometry Mesh {
              url [ "../meshes/body_dark.stl" ]
            }
          }
        ]
      }
      # R2025a ENU : l'image suit le +X local, le +Z local est le haut de l'image.
      # Caméra avant E12 (x 397..418, z 406..434), devant le support P13.
      Camera {
        translation 0.419 0 0.420
        rotation 0 0 1 0
        name "front_camera"
        description "Caméra avant"
        fieldOfView 1.047
        width 640
        height 480
        near 0.05
        far 30
      }
      # RPLIDAR A1M8 sur la rehausse P12 : axe x 355, plan de balayage z 483.8.
      # Balayage tournant autour de Y local. -90° sur X aligne cet axe sur -Z (plan horizontal, 360°).
      Lidar {
        translation 0.355 0 0.4838
        rotation 1 0 0 -1.5707963
        name "rplidar"
        horizontalResolution 720
        fieldOfView 6.28318
        verticalFieldOfView 0.02
        numberOfLayers 1
        minRange 0.15
        maxRange 12
        type "rotating"
        defaultFrequency 10
      }
      # Bras v9b. Pas de boîte de collision sur le bras (comme en v7) : au repos la pince
      # est dans le bac. Couples : DS3235 35 kg·cm = 3.43 N·m, RDS5160 60 kg·cm = 5.88 N·m.
      HingeJoint {
        jointParameters HingeJointParameters {
          # q1 = lacet CAO - 180°. Épaule sur l'axe de lacet (Y = 0 en v9b). Butées ±135° (HYPOTHÈSE).
          axis 0 0 1
          anchor 0.17 0 0.2
          dampingConstant 0.15
          staticFriction 0.05
        }
        device [
          RotationalMotor {
            name "S1_lacet"
            minPosition -2.3562
            maxPosition 2.3562
            maxVelocity 3
            maxTorque 3.43
            acceleration 8
            sound ""
