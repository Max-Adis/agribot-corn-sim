#VRML_SIM R2025a utf8
# Agribot v7. Cotes du xacro Gazebo (maillage FreeCAD en mm, échelle 0.001).
# Voie 0,48 m, empattement 0,60 m, rayon de roue 0,0825 m.
# Le cylindre Webots est aligné sur Z : la collision de roue est tournée sur Y.

PROTO Agribot [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "agribot"
  field SFString   controller  "agribot_controller"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    # Le bac P14 est déjà dans robot_static.stl (arrière, x -0,46..0,11 m).
    supervisor TRUE
    children [
      # Maillage CAO : x -0,462..0,420  y ±0,231  z 0,058..0,500 m
      Transform {
        scale 0.001 0.001 0.001
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.16 0.34 0.60
              roughness 0.45
              metalness 0.25
            }
            geometry Mesh {
              url [ "../meshes/robot_static.stl" ]
            }
          }
        ]
      }
      # R2025a ENU : l'image suit le +X local, le +Z local est le haut de l'image.
      # Rotation nulle : regard vers +X (l'allée), horizon horizontal.
      # 0 1 0 1.5708 enverrait ce +X vers le bas, sur la pince.
      # Pas d'autre Camera : la fenêtre robot n'a que front_camera.
      Camera {
        translation 0.408 0 0.420
        rotation 0 0 1 0
        name "front_camera"
        description "Caméra avant"
        fieldOfView 1.047
        width 640
        height 480
        near 0.05
        far 30
      }
      # Bras réel v7 (CAO FreeCAD, mêmes pièces que le maillage Gazebo).
      # S1 lacet Z, puis S2 épaule, S3 coude, S4 poignet, S5 mors : axes Y.
      # Position 0 = pose de conception. Pas de boîte de collision : le bras
      # est déjà dans le volume du châssis, la conduite ne change pas.
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.170 0 0.124
          dampingConstant 0.15
          staticFriction 0.05
        }
        device [
          RotationalMotor {
            name "S1_lacet"
            minPosition -2.3562
            maxPosition 2.3562
            maxVelocity 3
            maxTorque 3.4
            acceleration 8
            sound ""
          }
        ]
        endPoint Solid {
          translation 0.170 0 0.124
          name "S1_lacet_link"
          children [
            Transform {
              translation -0.170 0 -0.124
              scale 0.001 0.001 0.001
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.16 0.34 0.60
                    roughness 0.45
                    metalness 0.25
                  }
                  geometry Mesh {
                    url [ "../meshes/link_s1.stl" ]
                  }
                }
              ]
            }
            HingeJoint {
              jointParameters HingeJointParameters {
                axis 0 1 0
                anchor 0 -0.021 0.076
                dampingConstant 0.2
                staticFriction 0.08
              }
              device [
                RotationalMotor {
                  name "S2_epaule"
                  minPosition -1.5708
                  maxPosition 1.5708
                  maxVelocity 2
                  maxTorque 5.7
                  acceleration 6
                  sound ""
                }
              ]
              endPoint Solid {
                translation 0 -0.021 0.076
                name "S2_epaule_link"
                children [
                  Transform {
                    translation -0.170 0.021 -0.200
                    scale 0.001 0.001 0.001
                    children [
                      Shape {
                        appearance PBRAppearance {
                          baseColor 0.16 0.34 0.60
                          roughness 0.45
                          metalness 0.25
                        }
                        geometry Mesh {
                          url [ "../meshes/link_s2.stl" ]
                        }
                      }
                    ]
                  }
                  HingeJoint {
                    jointParameters HingeJointParameters {
                      axis 0 1 0
                      anchor 0.063393 0 0.135946
                      dampingConstant 0.15
                      staticFriction 0.05
                    }
                    device [
                      RotationalMotor {
                        name "S3_coude"
                        minPosition -2.2427
                        maxPosition 2.2427
                        maxVelocity 2
                        maxTorque 5.7
                        acceleration 6
                        sound ""
                      }
                    ]
                    endPoint Solid {
                      translation 0.063393 0 0.135946
                      name "S3_coude_link"
                      children [
                        Transform {
                          translation -0.233393 0.021 -0.335946
                          scale 0.001 0.001 0.001
                          children [
                            Shape {
                              appearance PBRAppearance {
                                baseColor 0.16 0.34 0.60
                                roughness 0.45
                                metalness 0.25
                              }
                              geometry Mesh {
                                url [ "../meshes/link_s3.stl" ]
                              }
                            }
                          ]
                        }
                        HingeJoint {
                          jointParameters HingeJointParameters {
                            # -Y : à +Y le poignet tournait à l'opposé de l'épaule et ne se rabattait pas.
                            axis 0 -1 0
                            anchor -0.226577 -0.0275 0.105655
                            dampingConstant 0.08
                            staticFriction 0.04
                          }
                          device [
                            RotationalMotor {
                              name "S4_poignet"
                              minPosition -2.1206
                              maxPosition 2.1206
                              maxVelocity 2.5
                              maxTorque 3.4
                              acceleration 8
                              sound ""
                            }
                          ]
                          endPoint Solid {
                            translation -0.226577 -0.0275 0.105655
                            name "S4_poignet_link"
                            children [
                              Transform {
                                translation -0.006816 0.0485 -0.441601
                                scale 0.001 0.001 0.001
                                children [
                                  Shape {
                                    appearance PBRAppearance {
                                      baseColor 0.16 0.34 0.60
                                      roughness 0.45
                                      metalness 0.25
                                    }
                                    geometry Mesh {
                                      url [ "../meshes/link_s4.stl" ]
                                    }
                                  }
                                ]
                              }
                              HingeJoint {
                                jointParameters HingeJointParameters {
                                  axis 0 1 0
                                  anchor 0.013073 -0.0045 -0.149429
                                  dampingConstant 0.04
                                  staticFriction 0.02
                                }
                                device [
                                  RotationalMotor {
                                    name "S5_pince"
                                    minPosition -2.3562
                                    maxPosition 2.3562
                                    maxVelocity 3
                                    maxTorque 3.4
                                    acceleration 10
                                    sound ""
                                  }
                                ]
                                endPoint Solid {
                                  translation 0.013073 -0.0045 -0.149429
                                  name "S5_pince_link"
                                  children [
                                    Transform {
                                      translation -0.019889 0.053 -0.292172
                                      scale 0.001 0.001 0.001
                                      children [
                                        Shape {
                                          appearance PBRAppearance {
                                            baseColor 0.16 0.34 0.60
                                            roughness 0.45
                                            metalness 0.25
                                          }
                                          geometry Mesh {
                                            url [ "../meshes/link_s5.stl" ]
                                          }
                                        }
                                      ]
                                    }
                                  ]
                                  physics Physics {
                                    density -1
                                    mass 0.08
                                    centerOfMass 0 0 0
                                    inertiaMatrix [ 0.0004 0.0004 0.0002 0 0 0 ]
                                  }
                                }
                              }
                            ]
                            physics Physics {
                              density -1
                              mass 0.22
                              centerOfMass 0 0 0
                              inertiaMatrix [ 0.0015 0.0015 0.0004 0 0 0 ]
                            }
                          }
                        }
                      ]
                      physics Physics {
                        density -1
                        mass 0.28
                        centerOfMass 0 0 0
                        inertiaMatrix [ 0.004 0.004 0.0006 0 0 0 ]
                      }
                    }
                  }
                ]
                physics Physics {
                  density -1
                  mass 0.35
                  centerOfMass 0 0 0
                  inertiaMatrix [ 0.004 0.004 0.0008 0 0 0 ]
                }
              }
            }
          ]
          physics Physics {
            density -1
            mass 0.4
            centerOfMass 0 0 0
            inertiaMatrix [ 0.004 0.004 0.002 0 0 0 ]
          }
        }
      }
      # Balayage tournant autour de Y local. -90° sur X aligne cet axe sur -Z (plan horizontal, 360°).
      Lidar {
        translation 0.342 0 0.472
        rotation 1 0 0 -1.5707963
        name "rplidar"
        horizontalResolution 720
        fieldOfView 6.28318
        verticalFieldOfView 0.02
        numberOfLayers 1
        minRange 0.15
        maxRange 12
        type "rotating"
        defaultFrequency 10
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.30 0.24 0.0825
          dampingConstant 0.06
          staticFriction 0.02
        }
        device [
          RotationalMotor {
            name "fl_motor"
            maxVelocity 18
            maxTorque 12
            acceleration 48.5
            sound ""
          }
        ]
        endPoint Solid {
          translation 0.30 0.24 0.0825
          name "fl_wheel"
          contactMaterial "tire"
          children [
            Transform {
              scale 0.001 0.001 0.001
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.20 0.45 0.19
                    roughness 0.85
                  }
                  geometry Mesh {
                    url [ "../meshes/front_left_wheel.stl" ]
                  }
                }
              ]
            }
          ]
          boundingObject Transform {
            rotation 1 0 0 1.5707963
            children [
              Cylinder {
                height 0.032
                radius 0.0825
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.30 -0.24 0.0825
          dampingConstant 0.06
          staticFriction 0.02
        }
        device [
          RotationalMotor {
            name "fr_motor"
            maxVelocity 18
            maxTorque 12
            acceleration 48.5
            sound ""
          }
        ]
        endPoint Solid {
          translation 0.30 -0.24 0.0825
          name "fr_wheel"
          contactMaterial "tire"
          children [
            Transform {
              scale 0.001 0.001 0.001
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.20 0.45 0.19
                    roughness 0.85
                  }
                  geometry Mesh {
                    url [ "../meshes/front_right_wheel.stl" ]
                  }
                }
              ]
            }
          ]
          boundingObject Transform {
            rotation 1 0 0 1.5707963
            children [
              Cylinder {
                height 0.032
                radius 0.0825
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.30 0.24 0.0825
          dampingConstant 0.06
          staticFriction 0.02
        }
        device [
          RotationalMotor {
            name "rl_motor"
            maxVelocity 18
            maxTorque 12
            acceleration 48.5
            sound ""
          }
        ]
        endPoint Solid {
          translation -0.30 0.24 0.0825
          name "rl_wheel"
          contactMaterial "tire"
          children [
            Transform {
              scale 0.001 0.001 0.001
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.20 0.45 0.19
                    roughness 0.85
                  }
                  geometry Mesh {
                    url [ "../meshes/rear_left_wheel.stl" ]
                  }
                }
              ]
            }
          ]
          boundingObject Transform {
            rotation 1 0 0 1.5707963
            children [
              Cylinder {
                height 0.032
                radius 0.0825
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.30 -0.24 0.0825
          dampingConstant 0.06
          staticFriction 0.02
        }
        device [
          RotationalMotor {
            name "rr_motor"
            maxVelocity 18
            maxTorque 12
            acceleration 48.5
            sound ""
          }
        ]
        endPoint Solid {
          translation -0.30 -0.24 0.0825
          name "rr_wheel"
          contactMaterial "tire"
          children [
            Transform {
              scale 0.001 0.001 0.001
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0.20 0.45 0.19
                    roughness 0.85
                  }
                  geometry Mesh {
                    url [ "../meshes/rear_right_wheel.stl" ]
                  }
                }
              ]
            }
          ]
          boundingObject Transform {
            rotation 1 0 0 1.5707963
            children [
              Cylinder {
                height 0.032
                radius 0.0825
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.65
          }
        }
      }
    ]
    # Boîte de collision du xacro. Bas à z=0,110 : au-dessus des roues (haut z=0,165)
    # et plus étroite (y ±0,215) que l'intérieur des roues (y ±0,224).
    boundingObject Transform {
      translation -0.018 0 0.255
      children [
        Box {
          size 0.84 0.43 0.29
        }
      ]
    }
    physics Physics {
      density -1
      mass 24
      centerOfMass 0 0 0.22
      inertiaMatrix [
        0.85 1.15 1.45
        0 0 0
      ]
    }
  }
}
